<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAIDO • Haute Japanese Dining & Omakase Tradition</title>
    <meta name="description" content="KAIDO Wien — Ein intimes Omakase-Erlebnis und zeitgenössische japanische Haute Cuisine im 2. Wiener Bezirk. Hingabe an Handwerkskunst und Saisonalität." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var userChoice = sessionStorage.getItem('kaido_theme_user_selected');
          if (userChoice === 'light' || userChoice === 'dark') {
            document.documentElement.setAttribute('data-theme', userChoice);
            return;
          }
          var hour = new Date().getHours();
          var isDay = hour >= 6 && hour < 19;
          document.documentElement.setAttribute('data-theme', isDay ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
